name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: limitra
          POSTGRES_PASSWORD: limitra_test_password
          POSTGRES_DB: limitra_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          playwright install --with-deps --no-shell chromium

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy app tests

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://limitra:limitra_test_password@localhost:5432/limitra_browser_test
        run: alembic upgrade head

      - name: Run Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://limitra:limitra_test_password@localhost:5432/limitra_browser_test
          REDIS_URL: redis://localhost:6379/0
          ENFORCE_API_KEYS: "true"
          BOOTSTRAP_ADMIN_API_KEY: test_admin_api_key_12345
          INTERNAL_SERVICE_SECRET: supplier-service-default-secret-salt-key-32ch
          QUICK_BUY_SIGNING_SECRET: quickbuy-default-secret-signing-key-32ch
        run: pytest -v

  docker-build-and-verify:
    name: Docker Build, Verify & Publish
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: limitra
          POSTGRES_PASSWORD: limitra_test_password
          POSTGRES_DB: limitra_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        run: |
          docker build -t limitra-browser:local-test .

      - name: Run Alembic Migrations Using Built Image
        run: |
          docker run --rm --network host \
            -e ENVIRONMENT=production \
            -e DATABASE_URL=postgresql+asyncpg://limitra:limitra_test_password@127.0.0.1:5432/limitra_browser_test \
            limitra-browser:local-test alembic upgrade head

      - name: Start Built API Container
        run: |
          docker run -d --name test-api --network host \
            -e ENVIRONMENT=production \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql+asyncpg://limitra:limitra_test_password@127.0.0.1:5432/limitra_browser_test \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e API_KEY_SECRET=testsecret123456789012345678901234 \
            -e INTERNAL_SERVICE_SECRET=internal_test_secret_123456789012 \
            -e BOOTSTRAP_ADMIN_API_KEY=ci_test_bootstrap_admin_key_32bytes_long \
            -e QUICK_BUY_SIGNING_SECRET=ci_test_quickbuy_secret_32bytes_long \
            -e ENFORCE_API_KEYS=false \
            -e BROWSER_MAX_GLOBAL_CONCURRENCY=1 \
            -e BROWSER_MAX_PER_SUPPLIER_CONCURRENCY=1 \
            limitra-browser:local-test

      - name: Verify API /health/live
        run: |
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:8000/health/live; then
              echo "API is alive!"
              exit 0
            fi
            echo "Waiting for API to start..."
            sleep 2
          done
          echo "API failed to start. Container logs:"
          docker logs test-api
          exit 1

      - name: Verify API /health/ready
        run: |
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:8000/health/ready; then
              echo "API is ready!"
              exit 0
            fi
            echo "Waiting for API to be ready..."
            sleep 2
          done
          echo "API failed to become ready. Container logs:"
          docker logs test-api
          exit 1


      - name: Start Built Worker Container
        run: |
          docker run -d --name test-worker --network host \
            -e ENVIRONMENT=production \
            -e DATABASE_URL=postgresql+asyncpg://limitra:limitra_test_password@127.0.0.1:5432/limitra_browser_test \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e API_KEY_SECRET=testsecret123456789012345678901234 \
            -e INTERNAL_SERVICE_SECRET=internal_test_secret_123456789012 \
            -e BOOTSTRAP_ADMIN_API_KEY=ci_test_bootstrap_admin_key_32bytes_long \
            -e QUICK_BUY_SIGNING_SECRET=ci_test_quickbuy_secret_32bytes_long \
            -e BROWSER_MAX_GLOBAL_CONCURRENCY=2 \
            -e BROWSER_MAX_PER_SUPPLIER_CONCURRENCY=1 \
            limitra-browser:local-test python -m app.workers.worker_main

      - name: Confirm Worker Heartbeat in Redis
        run: |
          sudo apt-get install -y redis-tools
          for i in {1..20}; do
            KEYS=$(redis-cli -h 127.0.0.1 -p 6379 keys "worker:heartbeat:*")
            if [ -n "$KEYS" ]; then
              echo "Worker heartbeat confirmed: $KEYS"
              exit 0
            fi
            echo "Waiting for worker heartbeat..."
            sleep 1
          done
          echo "Worker failed to report heartbeat"
          docker logs test-worker
          exit 1

      - name: Run Minimal API Smoke Test
        run: |
          curl -f http://127.0.0.1:8000/health

      - name: Stop Verification Containers
        run: |
          docker stop test-api test-worker || true
          docker rm test-api test-worker || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Tag and Push Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag limitra-browser:local-test "$tag"
            docker push "$tag"
          done
